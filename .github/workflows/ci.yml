name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v7.0.1
      - name: Hygiene files present
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f LICENSE
