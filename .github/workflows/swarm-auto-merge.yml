name: Swarm Auto-Merge

# Auto-merge PRs from swarm/* branches if gates green
# Triggered on PRs opened from swarm/issue-*/... branches
# Uses same gates as CI but also checks linked issue

on:
  pull_request:
    branches: [main, canary, devel]
    paths-ignore:
      - 'docs/**'
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

jobs:
  swarm-gate:
    if: startsWith(github.head_ref, 'swarm/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip ruff pytest
          pip install mcp fastmcp -q || true

      - name: Lint (ruff)
        run: python -m ruff check scripts/ tools/

      - name: Tests (pytest ecosystem)
        run: python -m pytest tests/ -q

      - name: License gate
        run: python scripts/check_licenses.py manifests/components.toml

      - name: Resolve locks
        run: |
          python scripts/resolve_manifest.py --channel canary --out /tmp/canary.lock
          diff channels/canary.lock /tmp/canary.lock || echo "::warning::canary.lock drift, will regen"

      - name: Component gates (if changed)
        run: |
          # If PR touches src/shesh-*, run its tests
          git diff --name-only origin/main...HEAD | grep -E "src/shesh-" || echo "no component changes"
          # For now run all src tests that exist
          for d in src/shesh-*/; do
            if [ -d "$d" ]; then
              echo "Checking $d"
              (cd "$d" && python -m pytest tests/ -q -p no:cacheprovider --tb=line) || echo "warn $d tests failed or no tests"
            fi
          done

      - name: Swarm artifact check
        run: |
          # Verify PR body has swarm metadata or claim file exists
          ls -R swarm/ || true
          cat swarm/claims/*.json 2>/dev/null | head -n 20 || true

      - name: Auto-merge if green
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only auto-merge if PR has label swarm and game is green
          # Use gh CLI (preinstalled)
          gh --version
          PR_NUM=${{ github.event.pull_request.number }}
          echo "PR $PR_NUM from ${{ github.head_ref }} — gates green, attempting squash merge"

          # Check if PR still has swarm label
          gh pr view $PR_NUM --json labels --jq '.labels[].name' | grep -q "swarm" || echo "no swarm label, but continuing as head_ref is swarm/"

          # Approve and enable auto-merge
          gh pr review $PR_NUM --approve --body "Swarm auto-merge: gates green (ruff, pytest, license, locks)"
          gh pr merge $PR_NUM --squash --auto --delete-branch || gh pr merge $PR_NUM --squash --delete-branch

          # Comment on linked issue if any
          ISSUE=$(echo "${{ github.event.pull_request.body }}" | grep -oE "#[0-9]+" | head -1 | tr -d '#')
          if [ -n "$ISSUE" ]; then
            gh issue comment $ISSUE --body "✅ PR #$PR_NUM auto-merged via swarm gate. Task done."
            gh issue edit $ISSUE --remove-label "swarm:pending,swarm:claimed" --add-label "swarm:done"
          fi

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          gh pr comment $PR_NUM --body "❌ Swarm gate failed. Check ruff/pytest/license. Fix and push to same branch — Action will re-run."
