name: Swarm auto-merge

# Auto-merges PRs raised from swarm/* branches once this repository's own gates
# are green.
#
# SECURITY: this workflow deliberately does NOT use pull_request_target. It
# checks out and executes (ruff, pytest) PR code with a write-scoped token; on
# pull_request_target a fork branch named swarm/x would run attacker code in
# our trust context. Same-repo swarm branches fire pull_request identically, so
# the dangerous trigger bought nothing but the vulnerability.
#
# Scope note (F002): the identity guard below used to compare against
# 'gaganjainse/shesh-ecosystem'. This workflow was moved into the factory
# repository and the condition was never updated, so it could never be true and
# the job silently never ran. It now derives the expected repository from the
# context instead of naming one, which cannot go stale on the next move. The
# manifest and licence steps were removed for the same reason as in
# swarm-scheduled.yml: those inputs live in shesh-ecosystem.

on:
  pull_request:
    branches: [main, canary, devel]
    paths-ignore:
      - 'docs/**'

permissions: read-all

concurrency:
  group: swarm-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  swarm-gate:
    # Only ever act on same-repository swarm branches.
    if: >-
      startsWith(github.head_ref, 'swarm/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install tools
        run: python -m pip install --upgrade pip ruff pytest cryptography

      - name: Lint
        run: python -m ruff check tools/ failures/

      - name: Tests
        run: python -m pytest tests/ -q

      - name: No recorded failure has returned
        run: python3 tools/guard.py --check

      - name: Auto-merge if green
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR fields are attacker-controlled text: they pass through env,
          # never inline in the script (expression-injection).
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "PR $PR_NUM from $HEAD_REF — gates green, attempting squash merge"
          # No `gh pr review --approve`: Actions tokens cannot approve PRs.
          gh pr merge "$PR_NUM" --squash --auto --delete-branch \
            || gh pr merge "$PR_NUM" --squash --delete-branch
          ISSUE=$(printf '%s' "$PR_BODY" | grep -oE "#[0-9]+" | head -1 | tr -d '#')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "PR #$PR_NUM auto-merged via the swarm gate."
            gh issue edit "$ISSUE" \
              --remove-label "swarm:pending,swarm:claimed" --add-label "swarm:done"
          fi

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUM" --body \
            "Swarm gate failed: check ruff, pytest, or the failure guards. Push a fix to the same branch and the workflow re-runs."
