name: Swarm scheduled janitor

# Hourly maintenance that needs no attended session. Runs on GitHub infra with
# GITHUB_TOKEN; no PAT required.
#
# Scope note (F002): this workflow lives in the factory repository. It used to
# resolve the component manifest and run the licence gate, but those inputs
# (manifests/, channels/, scripts/resolve_manifest.py, scripts/check_licenses.py)
# live in shesh-ecosystem and stayed there when the factory was split out. The
# steps failed on every cron for that reason. Manifest resolution and the
# licence gate are owned by shesh-ecosystem's own ci.yml and `make check`;
# duplicating them here is what broke. This job now only touches state that
# this repository actually holds.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed the queue from QUEUE.md into GitHub Issues"
        type: boolean
        default: true
      requeue_stale:
        description: "Re-queue claims older than the expiry window"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: janitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  janitor:
    name: janitor
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install tools
        run: python -m pip install --upgrade pip ruff pytest cryptography

      - name: Lint and test this repository
        run: |
          python -m ruff check tools/ failures/
          python -m pytest tests/ -q

      - name: No recorded failure has returned
        run: python3 tools/guard.py --check

      - name: Seed issues from the queue
        if: ${{ inputs.seed != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          SWARM_USE_GITHUB: "1"
        run: |
          if [ -f QUEUE.md ]; then
            python tools/swarm/orchestrator.py --seed QUEUE.md --dashboard
          else
            echo "::notice::QUEUE.md absent; nothing to seed"
          fi

      - name: Expire stale claims and check queue consistency
        if: ${{ inputs.requeue_stale != false }}
        run: python tools/steer.py check

      - name: Push janitor changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "shesh-janitor[bot]"
          git config user.email "shesh-janitor@users.noreply.github.com"
          for path in swarm QUEUE.md STEER.md; do
            if [ -e "$path" ]; then
              git add -A "$path"
            else
              echo "::notice::$path absent; nothing to stage"
            fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to push"
            exit 0
          fi
          git commit -m "chore: swarm janitor re-queue — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BRANCH="janitor/$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: swarm janitor — $(date -u +%Y-%m-%d)" \
            --body "Automated by the scheduled janitor."
          gh pr merge --auto --squash "$BRANCH"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Janitor run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Lint, tests, and failure guards for this repository"
            echo "- Seeded issues from QUEUE.md when enabled"
            echo "- Expired stale claims when enabled"
            echo ""
            echo "Manifest resolution and the licence gate belong to"
            echo "shesh-ecosystem and are not run here."
          } >> "$GITHUB_STEP_SUMMARY"
