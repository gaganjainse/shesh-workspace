name: Swarm Scheduled Janitor (True Hours Unattended)

# Runs every hour while you are traveling, with only orchestrator tab open on mobile.
# Does NOT need Arena tabs — runs on GitHub infra.
# Uses GITHUB_TOKEN (no PAT needed) — read/write issues, contents, pull-requests

on:
  schedule:
    - cron: "0 * * * *"   # every hour at minute 0
  workflow_dispatch:       # manual trigger from GitHub UI (useful on mobile)
    inputs:
      seed:
        description: "Seed queue from TODO.md into GitHub Issues?"
        type: boolean
        default: true
      requeue_stale:
        description: "Re-queue stale claims >10 min?"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip ruff pytest
          pip install mcp fastmcp -q || true

      - name: Resolve locks (deterministic check)
        run: |
          python scripts/resolve_manifest.py --channel stable --out /tmp/stable.lock
          python scripts/resolve_manifest.py --channel canary --out /tmp/canary.lock
          python scripts/resolve_manifest.py --channel devel --out /tmp/devel.lock
          diff channels/canary.lock /tmp/canary.lock || {
            echo "::warning::canary.lock drift — regen"
            cp /tmp/canary.lock channels/canary.lock
            cp /tmp/stable.lock channels/stable.lock
            cp /tmp/devel.lock channels/devel.lock
          }

      - name: Sync docs/components from src READMEs (if src present in cache)
        run: |
          if [ -d src/shesh-audit ]; then
            for repo in shesh-audit shesh-mind shesh-memory shesh-orchestrator shesh-skills shesh-acp shesh-harness shesh-backup shesh-calendar shesh-mcp-bundle shesh-containers shesh-phone shesh-secrets shesh-shell shesh-system shesh-files; do
              [ -f src/$repo/README.md ] && cp src/$repo/README.md docs/components/$repo.md || true
            done
          fi
          ls docs/components/ | wc -l

      - name: License gate + ruff + pytest
        run: |
          python -m ruff check scripts/ tools/
          python -m pytest tests/ -q
          python scripts/check_licenses.py manifests/components.toml

      - name: Swarm — seed Issues from TODO.md (if requested)
        if: ${{ inputs.seed != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWARM_USE_GITHUB: "1"
        run: |
          # Use file queue + Issues API via our scripts — GITHUB_TOKEN has issues:write
          # Our github_queue.py loads PAT from GITHUB_PAT env, but GITHUB_TOKEN also works for same-repo Issues
          export GITHUB_PAT=$GH_TOKEN
          python tools/swarm/orchestrator.py --seed TODO.md --dashboard || true

      - name: Swarm — re-queue stale claims >10 min (file queue)
        if: ${{ inputs.requeue_stale != false }}
        run: |
          # File-based stale re-queue logic from orchestrator monitor (one iteration)
          python - <<'PY'
          import pathlib, json, time
          from datetime import datetime, timezone
          root = pathlib.Path(".")
          claims = list((root / "swarm/claims").glob("*.json"))
          requeued = 0
          for cf in claims:
            try:
              data = json.loads(cf.read_text())
              claimed_at = data.get("claimed_at","")
              dt = datetime.fromisoformat(claimed_at.replace("Z","+00:00"))
              age = (datetime.now(timezone.utc) - dt).total_seconds()/60
              if age > 10:
                # check heartbeat
                hb = root / f"swarm/heartbeats/{data['agent_id']}.json"
                if not hb.exists():
                  print(f"Stale {cf} age {age:.1f} min no heartbeat -> delete")
                  cf.unlink()
                  qf = root / f"swarm/queue/{data['task_id']}.json"
                  if qf.exists():
                    qd = json.loads(qf.read_text())
                    qd["status"]="pending"
                    qf.write_text(json.dumps(qd, indent=2)+"\n")
                  requeued+=1
            except Exception as e:
              print(f"Error {cf}: {e}")
          print(f"Re-queued {requeued} stale claims")
          PY

      - name: Push janitor changes (locks, docs sync, re-queue)
        run: |
          git config user.name "shesh-janitor[bot]"
          git config user.email "shesh-janitor@users.noreply.github.com"
          git add channels/ docs/components/ swarm/ || true
          git diff --cached --quiet || git commit -m "chore: swarm janitor — locks + docs sync + re-queue stale [skip ci]"
          git push origin main || echo "Push failed or nothing to push"

      - name: Comment summary
        run: |
          echo "### Swarm Janitor run $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- Locks deterministic check + regen if drift" >> $GITHUB_STEP_SUMMARY
          echo "- Docs/components sync (if src cached)" >> $GITHUB_STEP_SUMMARY
          echo "- Seeded Issues from TODO.md ⬜ (if enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- Re-queued stale claims >10 min" >> $GITHUB_STEP_SUMMARY
          echo "- Uses GITHUB_TOKEN, no PAT needed, runs every hour while you travel" >> $GITHUB_STEP_SUMMARY
