# Distrobox assembly for Shesh — one-command onboarding
# Usage:
#   distrobox assemble create --file distrobox.ini
#   distrobox enter shesh

[shesh]
image=archlinux:latest
pull=true
init_hooks="pacman -Syu --noconfirm && pacman -S --noconfirm python python-pip python-pipx base-devel git curl jq nodejs npm podman restic android-tools"
additional_packages="python-mcp ruff"
exported_apps="newelle"
exported_bins="/home/${USER}/.local/bin/shesh-"
exported_bins_path="/home/${USER}/.local/bin"
